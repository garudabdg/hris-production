name: mobile_app_flutter
description: "HRIS Didimax Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  webview_flutter: ^4.10.0
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  intl: ^0.19.0
  timeago: ^3.7.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.3
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - .env
